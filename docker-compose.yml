services:
  app:
    build: .
    ports:
      - "8090:8090"
    env_file:
      - .env
    depends_on:
      graphdb:
        condition: service_started
      postgres:
        condition: service_started
      mongo:
        condition: service_started
    networks:
      - app-network

  graphdb:
    image: ontotext/graphdb:10.7.3
    ports:
      - "7200:7200"
    environment:
      - GDB_HEAP_SIZE=2g
    volumes:
      - graphdbdata:/opt/graphdb/home
    networks:
      - app-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: pdh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdh"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: npm start
    develop:
      watch:
        - action: sync
          path: ./web
          target: /src/web
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    networks:
      - app-network

volumes:
  postgres_data:
  mongo_data:
  graphdbdata:

networks:
  app-network:
    driver: bridge
